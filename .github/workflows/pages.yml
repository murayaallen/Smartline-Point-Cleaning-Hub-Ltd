name: Preview on GitHub Pages

# Rebuilds the GitHub Pages preview (make_pages.py -> dist/pages) and publishes it to the gh-pages
# branch on every push to main that touches the site. Pages serves that branch at
# https://murayaallen.github.io/Smartline-Point-Cleaning-Hub-Ltd/ -- a noindex preview for the client.
# The real site is smartlinepointcleaning.co.ke, deployed by zip (RUNBOOK.md).

on:
  push:
    branches: [main]
    paths: ["site/**", "make_pages.py", "site_content.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the preview (fails on any broken or unprefixed path)
        run: python3 make_pages.py

      - name: Publish dist/pages to gh-pages (one commit, replaced each time)
        working-directory: dist/pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Preview of ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
